l_japanese:

 # 1. 提案と返答
 AST_DJ_unite_with_hungary:0 "ハンガリーとの統合"
 AST_DJ_unite_with_hungary_desc:0 "遠く離れた二つの国を、一つの国家へ結びつけよう。"
 ast_dj.1.t:0 "オーストラリアからの統合提案"
 ast_dj.1.d:0 "オーストラリアから、同国の庇護の下で両国の統合を進める提案が届いた。この提案を受け入れるか、独立を守るために拒否するか、決断しなければならない。"
 ast_dj.1.a:0 "提案を受け入れる"
 ast_dj.1.b:0 "独立は譲れない"
 ast_dj.2.t:0 "ハンガリーが統合提案を承諾"
 ast_dj.2.d:0 "ハンガリー政府は我が国の提案を受け入れた。同国を我が国の庇護下に置き、統合に向けた第一歩を踏み出そう。"
 ast_dj.2.a:0 "両国の協力を進めよう"
 ast_dj.3.t:0 "ハンガリーが統合提案を拒否"
 ast_dj.3.d:0 "ハンガリー政府は、独立を維持するとして我が国の提案を拒否した。武力による従属化を目指すなら、戦争の準備が必要だ。"
 ast_dj.3.a:0 "次の手段を用意しよう"

 # 2. 即時併合
 AST_DJ_annex_hungary_immediate:0 "速やかな併合"
 AST_DJ_annex_hungary_immediate_desc:0 "ハンガリーを直接統治し、両国の統合を一気に進めよう。"
 ast_dj.4.t:0 "ハンガリーの併合"
 ast_dj.4.d:0 "ハンガリーを直接統治する準備が整った。併合を実施し、新国家の成立に向けて進もう。"
 ast_dj.4.a:0 "併合を実行する"

 # 3. 国家形成・国民精神・ニュース
 AST_DJ_formation_category:0 "国家の形成"
 AST_DJ_formation_category_desc:0 "ハンガリーとの統合を進め、新しい国の成立を目指そう。"
 AST_DJ_form_union:0 "オーストラリア＝ハンガリーを形成"
 AST_DJ_form_union_desc:0 "両国の統合を宣言する。"
 AST_HUN_UNION:0 "オーストラリア＝ハンガリー"
 AST_HUN_UNION_DEF:0 "オーストラリア＝ハンガリー"
 AST_HUN_UNION_ADJ:0 "オーストラリア＝ハンガリー"
 AST_DJ_union_spirit:0 "二つの国の連帯"
 AST_DJ_union_spirit_desc:0 "共通の未来に向けた連帯が、政治を支えている。"
 ast_dj_news.1.t:0 "オーストラリア＝ハンガリー成立"
 ast_dj_news.1.d:0 "オーストラリアはハンガリーとの統合を経て、新国家の成立を宣言した。"
 ast_dj_news.1.a:0 "世界地図が変わった"

 # 4. 段階的統合・現地政府との協力・投資
 AST_DJ_take_long_time:0 "段階的な統合"
 AST_DJ_take_long_time_desc:0 "統合を急ぐ必要はない。ハンガリーの現地政府を維持し、安定した関係を築こう。"
 AST_DJ_cooperate_with_local_government:0 "現地政府との協力"
 AST_DJ_cooperate_with_local_government_desc:0 "現地の行政機関と協力し、両国の統合に向けた体制を整えよう。"
 AST_DJ_annex_hungary:0 "ハンガリーを併合"
 AST_DJ_annex_hungary_desc:0 "ハンガリーの直接統治へ移行し、国家形成への道を開こう。"
 AST_DJ_invest_in_hungary:0 "ハンガリーへの投資"
 AST_DJ_invest_in_hungary_desc:0 "ハンガリーの産業を育成するため、工場の建設を進めよう。"

 # 5. エミュー君主・国民精神の強化
 AST_DJ_Having_His_Majesty_Emu_as_Sovereign:0 "エミュー陛下を君主に"
 AST_DJ_Having_His_Majesty_Emu_as_Sovereign_desc:0 "新国家には、両国を象徴する君主が必要だ。ロッド・ハルとともに、エミュー陛下を迎えよう。"
 AST_DJ_union_spirit_2:0 "二つの国の連帯"
 AST_DJ_union_spirit_2_desc:0 "共通の未来に向けた連帯は、軍備の研究と生産にも広がった。海軍装備と航空機の研究を進め、小銃と航空機の生産体制を強化する。"
