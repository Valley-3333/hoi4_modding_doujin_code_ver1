l_japanese:

 # 1. 提案と返答
 AST_DJ_unite_with_hungary: "ハンガリーとの統合"
 AST_DJ_unite_with_hungary_desc: "遠く離れた二つの国を、一つの国家へ結びつけよう。"
 ast_dj.1.t: "オーストラリアからの統合提案"
 ast_dj.1.d: "オーストラリアから、同国の庇護の下で両国の統合を進める提案が届いた。この提案を受け入れるか、独立を守るために拒否するか、決断しなければならない。"
 ast_dj.1.a: "提案を受け入れる"
 ast_dj.1.b: "独立は譲れない"
 ast_dj.2.t: "ハンガリーが統合提案を承諾"
 ast_dj.2.d: "ハンガリー政府は我が国の提案を受け入れた。同国を我が国の庇護下に置き、統合に向けた第一歩を踏み出そう。"
 ast_dj.2.a: "両国の協力を進めよう"
 ast_dj.3.t: "ハンガリーが統合提案を拒否"
 ast_dj.3.d: "ハンガリー政府は、独立を維持するとして我が国の提案を拒否した。武力による従属化を目指すなら、戦争の準備が必要だ。"
 ast_dj.3.a: "次の手段を用意しよう"

 # 2. 即時併合
 AST_DJ_annex_hungary_immediate: "速やかな併合"
 AST_DJ_annex_hungary_immediate_desc: "ハンガリーを直接統治し、両国の統合を一気に進めよう。"
 ast_dj.4.t: "ハンガリーの併合"
 ast_dj.4.d: "ハンガリーを直接統治する準備が整った。併合を実施し、新国家の成立に向けて進もう。"
 ast_dj.4.a: "併合を実行する"

 # 3. NF3：段階的な統合
 AST_DJ_take_long_time: "段階的な統合"
 AST_DJ_take_long_time_desc: "統合を急ぐ必要はない。ハンガリーの現地政府を維持し、安定した関係を築こう。"

 # 4. NF4・5：現地政府との協力・投資
 AST_DJ_cooperate_with_local_government: "現地政府との協力"
 AST_DJ_cooperate_with_local_government_desc: "現地の行政機関と協力し、両国の統合に向けた体制を整えよう。"
 AST_DJ_unlock_annex_hungary_tt: "§Yハンガリーを併合§!ディシジョンを解禁する。この併合後、迎合度条件なしで§Yオーストラリア＝ハンガリー§!を形成できる。"
 AST_DJ_invest_in_hungary: "ハンガリーへの投資"
 AST_DJ_invest_in_hungary_desc: "ハンガリーの産業を育成するため、工場の建設を進めよう。"

 # 5. デシジョン・国家形成・国民精神・ニュース
 AST_DJ_formation_category: "国家の形成"
 AST_DJ_formation_category_desc: "ハンガリーとの統合を進め、新しい国の成立を目指そう。"
 AST_DJ_annex_hungary: "ハンガリーを併合"
 AST_DJ_annex_hungary_desc: "ハンガリーの直接統治へ移行し、国家形成への道を開こう。"
 AST_DJ_form_union: "オーストラリア＝ハンガリーを形成"
 AST_DJ_form_union_desc: "両国の統合を宣言する。段階的な統合では、現地政府との協力を完了し、ハンガリーを併合すれば形成できる。速やかな併合では、自国が領有するハンガリー中核州すべての迎合度が35を超える必要がある。いずれもハンガリー中核州を少なくとも1州領有する必要がある。"
 AST_HUN_UNION: "オーストラリア＝ハンガリー"
 AST_HUN_UNION_DEF: "オーストラリア＝ハンガリー"
 AST_HUN_UNION_ADJ: "オーストラリア＝ハンガリー"
 AST_DJ_union_spirit: "二つの国の連帯"
 AST_DJ_union_spirit_desc: "共通の未来に向けた連帯が、政治を支えている。"
 ast_dj_news.1.t: "オーストラリア＝ハンガリー成立"
 ast_dj_news.1.d: "オーストラリアはハンガリーとの統合を経て、新国家の成立を宣言した。"
 ast_dj_news.1.a: "世界地図が変わった"

 # 6. NF6：エミュー君主・国民精神の強化
 AST_DJ_Having_His_Majesty_Emu_as_Sovereign: "エミュー陛下を君主に"
 AST_DJ_Having_His_Majesty_Emu_as_Sovereign_desc: "新国家には、両国を象徴する君主が必要だ。ロッド・ハルとともに、エミュー陛下を迎えよう。"
 AST_DJ_emperor_emu_with_rod_hull: "エミュー皇帝とロッド・ハル"
 AST_DJ_union_spirit_2: "二つの国の連帯"
 AST_DJ_union_spirit_2_desc: "共通の未来に向けた連帯は、軍備の研究と生産にも広がった。海軍装備と航空機の研究を進め、小銃と航空機の生産体制を強化する。"
